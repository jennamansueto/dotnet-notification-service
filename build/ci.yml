# CI pipeline — Azure DevOps
# Migrated to .NET 8: dotnet CLI on Linux (no NuGet/MSBuild/VSTest, no Windows).

trigger:
  branches:
    include:
      - main
      - release/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  solution: 'Contoso.NotificationRelay.Legacy.sln'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  - script: dotnet restore $(solution)
    displayName: 'Restore'

  - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
    displayName: 'Build'

  - script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build
    displayName: 'Test'
