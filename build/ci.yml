# CI pipeline — Azure DevOps / GitHub Actions
# .NET 8 cross-platform build

trigger:
  branches:
    include:
      - main
      - release/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.0.x'

  - script: dotnet restore Contoso.NotificationRelay.Legacy.sln
    displayName: 'Restore NuGet Packages'

  - script: dotnet build Contoso.NotificationRelay.Legacy.sln --configuration $(buildConfiguration) --no-restore
    displayName: 'Build Solution'

  - script: dotnet test Contoso.NotificationRelay.Legacy.sln --configuration $(buildConfiguration) --no-build --logger trx
    displayName: 'Run Tests'
